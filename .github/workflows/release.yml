name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ./moirun/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./moirun

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./moirun
          tagName: v__VERSION__
          releaseName: '眸润 v__VERSION__'
          releaseBody: '跨平台桌面健康提醒应用。详见 [CHANGELOG](../CHANGELOG.md)。'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
