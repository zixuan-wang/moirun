name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./moirun/package-lock.json

      - name: Install Rust
        run: rustup update stable

      - name: Install frontend dependencies
        run: npm install
        working-directory: ./moirun

      - name: Type-check frontend
        run: npx tsc --noEmit
        working-directory: ./moirun

      - name: Build frontend
        run: npm run build
        working-directory: ./moirun

      - name: Build Tauri
        run: npx tauri build
        working-directory: ./moirun

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moirun-${{ matrix.platform }}
          path: |
            ./moirun/src-tauri/target/release/bundle/dmg/*.dmg
            ./moirun/src-tauri/target/release/bundle/macos/*.app*
            ./moirun/src-tauri/target/release/bundle/msi/*.msi
            ./moirun/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore
